spring:
  application:
    name: michelin
  datasource:
    url: jdbc:h2:./michelin;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
