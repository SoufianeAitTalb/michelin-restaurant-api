spring:
  application:
    name: michelin
  datasource:
    url: jdbc:h2:./michelin;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.bober.ovh/realms/master
          jwk-set-uri: https://keycloak.bober.ovh/realms/master/protocol/openid-connect/certs

s3:
  url: https://s3.bober.ovh
  accessKeyId: ${S3_ACCESS_KEY_ID:}
  secretAccessKey: ${S3_SECRET_ACCESS_KEY:}

lucene:
  index: index
